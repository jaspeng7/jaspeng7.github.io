<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyQuarter Legal</title>
<meta name="description" content="MyQuarter's privacy policy and terms of service.">
<link rel="preload" href="fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Lora";
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url("fonts/lora-latin.woff2") format("woff2");
}
:root {
  color-scheme: light dark;
  --page: #f1f4ec;
  --page-top: #c9dabf;
  --foreground: #15201a;
  --body: #2f3a2c;
  --meta: #5e6e58;
  --rule: #c9d4c2;
  --focus: #4e7a3e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d;
    --page-top: #1c2f20;
    --foreground: #f4f7f0;
    --body: #dde4d8;
    --meta: #9ba797;
    --rule: rgba(255, 255, 255, 0.12);
    --focus: #a8c05b;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page) linear-gradient(var(--page-top), var(--page) 280px) no-repeat;
  color: var(--body);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: max(28px, env(safe-area-inset-top)) max(clamp(16px, 6vw, 28px), env(safe-area-inset-right))
    max(56px, env(safe-area-inset-bottom)) max(clamp(16px, 6vw, 28px), env(safe-area-inset-left));
}
.brand { font: 600 15px/1.4 "Lora", Georgia, serif; color: var(--foreground); text-decoration: none; }
h1, h2 { font-family: "Lora", Georgia, serif; font-weight: 500; color: var(--foreground); letter-spacing: -0.01em; }
h1 { font-size: 30px; line-height: 1.2; margin: 28px 0 6px; }
h2 { font-size: 20px; line-height: 1.3; margin: 40px 0 10px; }
p, ul { margin: 0 0 14px; }
ul { padding-left: 1.25rem; }
li { margin-bottom: 8px; }
.effective, .foot { color: var(--meta); font-size: 14px; }
.contents { margin-top: 24px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.contents p { color: var(--meta); font-size: 14px; margin-bottom: 6px; }
.contents ul { list-style: none; padding: 0; margin: 0; columns: 2 12rem; column-gap: 24px; }
.contents li { margin: 0 0 4px; break-inside: avoid; }
.contents a { font-size: 15px; }
a { color: var(--foreground); text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; }
a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 2px; }
.foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--rule); }
.foot a { color: var(--meta); }
.docs { list-style: none; padding: 0; margin: 24px 0; }
.docs li { margin: 0; border-top: 1px solid var(--rule); }
.docs li:last-child { border-bottom: 1px solid var(--rule); }
.docs a { display: flex; justify-content: space-between; align-items: center; min-height: 56px; text-decoration: none;
  font: 500 18px/1.3 "Lora", Georgia, serif; }
.docs a::after { content: "\203A"; color: var(--meta); font-family: system-ui, sans-serif; font-size: 22px; }
</style>
</head>
<body>
<main>
<a class="brand" href="./">MyQuarter</a>
<h1>Legal</h1>
<p>MyQuarter is a personal goal and planning app for iPhone and Mac.</p>
<ul class="docs">
  <li><a href="privacy.html">Privacy policy</a></li>
  <li><a href="terms.html">Terms of service</a></li>
</ul>
<p>Questions or requests: <a href="mailto:myquarterapp@gmail.com">myquarterapp@gmail.com</a>.</p>
<p class="foot"><a href="privacy.html">Privacy policy</a> · <a href="terms.html">Terms of service</a> · <a href="mailto:myquarterapp@gmail.com">myquarterapp@gmail.com</a></p>
</main>
</body>
</html>
